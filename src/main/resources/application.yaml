spring:
  application:
    name: clients

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5433/clients_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

swagger-settings:
  server-url: http://localhost:8081